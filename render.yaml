services:
  - type: web
    name: planly
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install --global pnpm@11.25.0 && pnpm install --frozen-lockfile && pnpm db:migrate && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: planly-db
          property: connectionString
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD_HASH
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

databases:
  - name: planly-db
    databaseName: planly
    user: planly
    plan: free
    region: frankfurt
    postgresMajorVersion: '17'
    ipAllowList: []
