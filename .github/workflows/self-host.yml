name: Self-host build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/self-host-build]

permissions:
  contents: read

jobs:
  docker-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PLANLY_BASE_URL: http://localhost:3000
      PLANLY_OWNER_EMAIL: owner@example.test
      PLANLY_OWNER_PASSWORD: isolated-ci-owner-password-2026
      PLANLY_SELF_HOST_TEST: isolated-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Initialize isolated test credentials
        run: printf '%s' "$PLANLY_OWNER_PASSWORD" | node --experimental-strip-types scripts/init-self-host.mjs --email "$PLANLY_OWNER_EMAIL"
      - name: Validate Compose
        run: docker compose --env-file .env.self-host config --quiet
      - name: Build application and private object storage
        run: docker compose --env-file .env.self-host build
      - name: Start migrated web and publication worker
        run: docker compose --env-file .env.self-host up -d --wait --wait-timeout 120
      - name: Verify HTTP, media, persistence and scheduler recovery
        run: node tests/self-host-smoke.mjs
      - name: Package verified Next.js build with source
        run: |
          mkdir -p artifacts/release
          git archive HEAD | tar -x -C artifacts/release
          build_container=$(docker create planly:local)
          docker cp "$build_container:/app/.next" artifacts/release/.next
          docker rm "$build_container"
          tar --exclude='.next/cache' -czf artifacts/planly-build.tgz -C artifacts/release .
      - name: Upload verified build
        uses: actions/upload-artifact@v4
        with:
          name: planly-build-${{ github.sha }}
          path: artifacts/planly-build.tgz
          retention-days: 3
          if-no-files-found: error
      - name: Diagnostics on failure
        if: failure()
        run: docker compose --env-file .env.self-host ps -a && docker compose --env-file .env.self-host logs --no-color --tail 80
      - name: Stop isolated stack
        if: always()
        run: docker compose --env-file .env.self-host down --volumes --remove-orphans

  telegram-live:
    # An explicit commit label is the one-time trigger. Ordinary CI never publishes.
    if: github.event_name == 'push' && github.run_attempt == 1 && contains(github.event.head_commit.message, '[telegram-live]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      PLANLY_TELEGRAM_TEST_CHANNEL: '@danil_sochi_realty'
      PLANLY_TELEGRAM_LIVE_TEST: confirmed-test-channel
      PLANLY_BASE_URL: http://localhost:3000
      PLANLY_OWNER_EMAIL: owner@example.test
      PLANLY_OWNER_PASSWORD: isolated-ci-owner-password-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Require privately configured bot token
        run: node -e "if (!process.env.TELEGRAM_BOT_TOKEN) {console.error('Configure TELEGRAM_BOT_TOKEN in repository Actions secrets.'); process.exit(1)}"
      - name: Validate bot and test destination before building
        run: |
          node --experimental-strip-types --input-type=module <<'JAVASCRIPT'
          import { createTelegramConnector } from './lib/server/connectors/telegram.ts';
          const raw = process.env.TELEGRAM_BOT_TOKEN ?? '';
          console.log('Token shape checks:', JSON.stringify({present:!!raw.trim(),outerWhitespace:raw!==raw.trim(),normalizedFormat:/^\d+:[A-Za-z0-9_-]{20,}$/.test(raw.trim())}));
          const result = await createTelegramConnector({token:process.env.TELEGRAM_BOT_TOKEN ?? ''}).validate(process.env.PLANLY_TELEGRAM_TEST_CHANNEL);
          if (!result.ok) {
            console.error(`Telegram preflight: ${result.code} — ${result.message}`);
            process.exit(1);
          }
          console.log('PASS Telegram bot identity, destination type and administrator permission');
          JAVASCRIPT
      - name: Initialize isolated credentials
        run: printf '%s' "$PLANLY_OWNER_PASSWORD" | node --experimental-strip-types scripts/init-self-host.mjs --email "$PLANLY_OWNER_EMAIL"
      - name: Install video fixture generator
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Generate disposable photo and video fixtures
        run: |
          mkdir -p artifacts/telegram-fixtures
          python - <<'PYTHON'
          import struct,zlib,pathlib
          def chunk(kind,data):
              return struct.pack('!I',len(data))+kind+data+struct.pack('!I',zlib.crc32(kind+data)&0xffffffff)
          for name,color in [('photo.png',(30,130,200)),('photo2.png',(100,60,170))]:
              pixels=(b'\0'+bytes(color)*640)*640
              data=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('!IIBBBBB',640,640,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(pixels))+chunk(b'IEND',b'')
              pathlib.Path('artifacts/telegram-fixtures/'+name).write_bytes(data)
          PYTHON
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=blue:s=640x480:d=2 -c:v libx264 -pix_fmt yuv420p -movflags +faststart artifacts/telegram-fixtures/video.mp4
      - name: Build and start the actual worker stack
        run: docker compose --env-file .env.self-host up -d --build --wait --wait-timeout 120
      - name: Publish marked test messages through Planly API and worker
        run: node --experimental-strip-types tests/telegram-live-smoke.mjs
      - name: Save safe publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: telegram-live-${{ github.sha }}
          path: artifacts/telegram-live-evidence.json
          retention-days: 3
      - name: Stop disposable stack
        if: always()
        run: docker compose --env-file .env.self-host down --volumes --remove-orphans
