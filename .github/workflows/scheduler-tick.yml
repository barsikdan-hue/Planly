name: Planly scheduler tick

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger production scheduler tick
        env:
          PLANLY_SCHEDULER_TICK_URL: https://planly-m4zq.onrender.com/api/scheduler/tick
          SCHEDULER_TICK_SECRET: ${{ secrets.SCHEDULER_TICK_SECRET }}
        run: |
          test -n "$SCHEDULER_TICK_SECRET"
          curl --fail-with-body --silent --show-error \
            --request POST "$PLANLY_SCHEDULER_TICK_URL" \
            --header "Authorization: Bearer $SCHEDULER_TICK_SECRET"
