name: Foundation Generate

on:
  pull_request:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Clean stale migration metadata
        run: rm -rf drizzle
      - name: Generate PostgreSQL migration from scratch
        run: pnpm db:generate
      - name: Upload clean PostgreSQL migration
        uses: actions/upload-artifact@v4
        with:
          name: postgres-migration-clean
          path: drizzle/
          if-no-files-found: error
