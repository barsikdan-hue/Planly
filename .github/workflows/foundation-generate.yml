name: Foundation Generate

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate PostgreSQL migrations
        run: pnpm db:generate
      - name: Commit generated migration changes
        run: |
          if git diff --quiet -- drizzle/; then
            echo "Migrations already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle/
          git commit -m "build: refresh PostgreSQL migrations"
          git push origin HEAD:${{ github.head_ref }}
