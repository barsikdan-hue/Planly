name: VK Mini App probe

on:
  pull_request:
    paths:
      - 'experiments/vk-miniapp-probe/**'
      - 'public/vk-user-upload*.mjs'
      - 'public/vk-upload-receipt*.mjs'
      - 'lib/server/vk/upload-receipt*.ts'
      - 'tests/vk-receipt*'
      - 'tests/vk-upload-receipt*'
      - 'app/social-connections/vk-upload-receipt-test/**'
      - 'app/api/social-accounts/vk/upload-receipt-test/**'
      - 'lib/server/vk/user-upload*.ts'
      - 'tests/vk-user-upload*'
      - 'app/social-connections/vk-user-upload-test/**'
      - 'app/api/social-accounts/vk/user-upload-test/**'
      - 'tests/vk-miniapp-probe.test.mjs'
      - 'tests/vk-single-photo-test.test.mjs'
      - 'tests/vk-new-post-proof.test.mjs'
      - 'tests/vk-upload-only.test.mjs'
      - 'tests/vk-server-upload-client.test.mjs'
      - 'tests/vk-upload-relay.test.ts'
      - 'tests/vk-owner-admission.test.ts'
      - 'lib/server/vk/owner-admission.ts'
      - 'lib/server/vk/upload-window-document.ts'
      - 'public/vk-upload-window*.mjs'
      - 'tests/vk-first-party*'
      - 'tests/vk-curl*'
      - 'public/vk-curl*'
      - 'scripts/*vk-curl*'
      - 'app/social-connections/vk-curl-export/**'
      - 'app/social-connections/vk-upload-test/**'
      - 'lib/server/vk/upload-relay*.ts'
      - 'lib/server/vk/upload-rejection.ts'
      - 'public/vk-upload-diagnostic.mjs'
      - 'tests/vk-rejection-*.test.ts'
      - 'app/api/social-accounts/vk/upload-test/**'
      - '.github/workflows/vk-miniapp-probe.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/vk-miniapp-probe/**'
      - 'public/vk-user-upload*.mjs'
      - 'public/vk-upload-receipt*.mjs'
      - 'lib/server/vk/upload-receipt*.ts'
      - 'tests/vk-receipt*'
      - 'tests/vk-upload-receipt*'
      - 'app/social-connections/vk-upload-receipt-test/**'
      - 'app/api/social-accounts/vk/upload-receipt-test/**'
      - 'lib/server/vk/user-upload*.ts'
      - 'tests/vk-user-upload*'
      - 'app/social-connections/vk-user-upload-test/**'
      - 'app/api/social-accounts/vk/user-upload-test/**'
      - 'tests/vk-miniapp-probe.test.mjs'
      - 'tests/vk-single-photo-test.test.mjs'
      - 'tests/vk-new-post-proof.test.mjs'
      - 'tests/vk-upload-only.test.mjs'
      - 'tests/vk-server-upload-client.test.mjs'
      - 'tests/vk-upload-relay.test.ts'
      - 'tests/vk-owner-admission.test.ts'
      - 'lib/server/vk/owner-admission.ts'
      - 'lib/server/vk/upload-window-document.ts'
      - 'public/vk-upload-window*.mjs'
      - 'tests/vk-first-party*'
      - 'tests/vk-curl*'
      - 'public/vk-curl*'
      - 'scripts/*vk-curl*'
      - 'app/social-connections/vk-curl-export/**'
      - 'app/social-connections/vk-upload-test/**'
      - 'lib/server/vk/upload-relay*.ts'
      - 'lib/server/vk/upload-rejection.ts'
      - 'public/vk-upload-diagnostic.mjs'
      - 'tests/vk-rejection-*.test.ts'
      - 'app/api/social-accounts/vk/upload-test/**'
      - '.github/workflows/vk-miniapp-probe.yml'

permissions:
  contents: read

jobs:
  verify-static-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Distinct dated post identity and legacy marker preservation
        run: node --test tests/vk-new-post-proof.test.mjs
      - name: Synthetic safety and cancellation tests (no provider access)
        run: node --experimental-strip-types --test tests/vk-miniapp-probe.test.mjs tests/vk-single-photo-test.test.mjs tests/vk-upload-only.test.mjs tests/vk-server-upload-client.test.mjs tests/vk-upload-relay.test.ts tests/vk-owner-admission.test.ts tests/vk-first-party-window.test.mjs tests/vk-first-party-sender.test.mjs tests/vk-first-party-document.test.ts tests/vk-rejection-diagnostic.test.ts tests/vk-rejection-transport.test.ts tests/vk-curl-export.test.mjs tests/vk-user-upload-server.test.ts tests/vk-user-upload-window.test.mjs tests/vk-user-upload-sender.test.mjs tests/vk-user-upload-document.test.ts
      - name: Standalone curl offline safety tests
        run: python3 -B tests/vk-curl-control.test.py
      - name: First-party upload receipt and window contract safety (no provider access)
        run: node --experimental-strip-types --test tests/vk-upload-receipt-protocol.test.mjs tests/vk-upload-receipt.test.ts tests/vk-receipt-window.test.mjs
      - name: Install isolated pinned build dependencies
        run: npm ci --prefix experiments/vk-miniapp-probe --ignore-scripts --no-audit --no-fund
      - name: Build static diagnostic assets
        run: npm run build --prefix experiments/vk-miniapp-probe
      - name: Owner window browser tests (intercepted origins only)
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile --ignore-scripts
          npx playwright install --with-deps chromium
          node --experimental-strip-types tests/vk-user-upload-browser.mjs
          node --experimental-strip-types tests/vk-receipt-browser.mjs
      - name: Record exact asset hashes
        working-directory: experiments/vk-miniapp-probe/dist
        run: |
          git rev-parse HEAD > SOURCE_REVISION
          sha256sum index.html app.js style.css SOURCE_REVISION > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: vk-miniapp-probe-static
          path: experiments/vk-miniapp-probe/dist/
          retention-days: 7
