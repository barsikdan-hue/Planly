name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/foundation-content-core]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: planly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d planly_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/planly_test
      NODE_ENV: test
      OWNER_EMAIL: owner@example.test
      OWNER_PASSWORD_HASH: scrypt$1$16384$8$1$MRKHWrP9j2HsWqyI1-1eWg$HUYq2oQbrO3ToeGuVS_BBUCpewsP5WFCjbUfrYLSAoVUHoRe6zgujxITVbc1yH51FbjZdjoQ_08y-lnl0bgcUA
      SESSION_SECRET: ci-session-secret-not-for-production-0000000001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install pnpm
        run: npm install --global pnpm@11.25.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify migration drift
        run: |
          pnpm db:generate
          git diff --exit-code -- drizzle/

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
