name: Backup receiver

on:
  pull_request:
    paths:
      - 'scripts/backup/**'
      - 'tests/backup/**'
      - '.github/workflows/backup-receiver.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/backup/**'
      - 'tests/backup/**'
      - '.github/workflows/backup-receiver.yml'

permissions:
  contents: read

jobs:
  offline-safety:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify synthetic snapshot safety (no SSH or real secrets)
        run: python -B -m unittest discover -s tests/backup -v
      - name: Diagnose synthetic Windows ownership on failure
        if: failure() && runner.os == 'Windows'
        run: python -B tests/backup/windows_acl_diagnostic.py
