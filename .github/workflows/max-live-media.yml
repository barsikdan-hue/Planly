name: MAX live media test
on:
  push:
    branches: [feat/self-host-build, feat/telegram-max-ui-validation]
permissions:
  contents: read
jobs:
  max-live-media:
    if: github.run_attempt == 1 && (contains(github.event.head_commit.message, '[max-live-media]') || contains(github.event.head_commit.message, '[max-live-planly-e2e]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: planly_live
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d planly_live"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/planly_live
      REDIS_URL: redis://127.0.0.1:6379
      NODE_ENV: test
      OWNER_EMAIL: owner@example.test
      OWNER_PASSWORD_HASH: scrypt$1$16384$8$1$MRKHWrP9j2HsWqyI1-1eWg$HUYq2oQbrO3ToeGuVS_BBUCpewsP5WFCjbUfrYLSAoVUHoRe6zgujxITVbc1yH51FbjZdjoQ_08y-lnl0bgcUA
      SESSION_SECRET: live-session-secret-not-for-production-0000000001
      MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
      PLANLY_MAX_LIVE_TEST: confirmed-owner-channel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Install dependencies for Planly E2E
        if: contains(github.event.head_commit.message, '[max-live-planly-e2e]')
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Apply database migrations for Planly E2E
        if: contains(github.event.head_commit.message, '[max-live-planly-e2e]')
        run: pnpm db:migrate
      - name: Fetch official Russian trusted root with verified HTTPS
        run: |
          mkdir -p /tmp/max-ca
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt -o /tmp/max-ca/root.pem
          openssl x509 -in /tmp/max-ca/root.pem -noout -subject -issuer -dates -fingerprint -sha256
      - name: Generate test photo and video
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p artifacts/max-fixtures
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=blue:s=640x480:d=2 -c:v libx264 -pix_fmt yuv420p -movflags +faststart artifacts/max-fixtures/video.mp4
          ffmpeg -hide_banner -loglevel error -i artifacts/max-fixtures/video.mp4 -frames:v 1 artifacts/max-fixtures/photo.png
      - name: Validate owner destination and publish owner requested media tests
        if: contains(github.event.head_commit.message, '[max-live-media]')
        env:
          NODE_EXTRA_CA_CERTS: /tmp/max-ca/root.pem
        run: node --experimental-strip-types scripts/max-live-media.mjs
      - name: Publish one owner MAX post through Planly API, storage, queue and worker
        if: contains(github.event.head_commit.message, '[max-live-planly-e2e]')
        env:
          NODE_EXTRA_CA_CERTS: /tmp/max-ca/root.pem
          PLANLY_MAX_LIVE_E2E: confirmed-owner-planly-chain
        run: node --experimental-strip-types scripts/max-live-planly-e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: max-official-public-ca
          path: /tmp/max-ca/root.pem
          retention-days: 7
