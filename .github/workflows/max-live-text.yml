name: MAX live text test
on:
  push:
    branches: [feat/self-host-build]
permissions:
  contents: read
jobs:
  max-live-text:
    if: github.run_attempt == 1 && contains(github.event.head_commit.message, '[max-live-text]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
      PLANLY_MAX_LIVE_TEST: confirmed-owner-channel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Fetch official Russian trusted root with verified HTTPS
        run: |
          mkdir -p /tmp/max-ca
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt -o /tmp/max-ca/root.pem
          openssl x509 -in /tmp/max-ca/root.pem -noout -subject -issuer -dates -fingerprint -sha256
      - name: Validate owner destination and publish one test message
        env:
          NODE_EXTRA_CA_CERTS: /tmp/max-ca/root.pem
        run: node --experimental-strip-types scripts/max-live-text.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: max-official-public-ca
          path: /tmp/max-ca/root.pem
          retention-days: 7
