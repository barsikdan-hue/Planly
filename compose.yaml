name: planly

x-app: &app
  image: planly:local
  build:
    context: .
    dockerfile: Dockerfile
  init: true

x-runtime-env: &runtime-env
  NODE_ENV: production
  DATABASE_URL: postgresql://planly:${POSTGRES_PASSWORD:?Initialize .env.self-host first}@postgres:5432/planly
  REDIS_URL: redis://redis:6379
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: planly
      POSTGRES_DB: planly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Initialize .env.self-host first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U planly -d planly"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  storage:
    image: planly-storage:local
    build:
      context: .
      dockerfile: docker/storage.Dockerfile
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Initialize .env.self-host first}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Initialize .env.self-host first}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - media-data:/data
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:9000/minio/health/ready]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  storage-init:
    image: planly-storage:local
    environment:
      MC_HOST_local: http://${S3_ACCESS_KEY_ID}:${S3_SECRET_ACCESS_KEY}@storage:9000
      S3_BUCKET: ${S3_BUCKET:-planly-media}
    command: [sh, -ec, 'mc --config-dir /tmp/planly-mc mb --ignore-existing "local/$$S3_BUCKET"']
    depends_on:
      storage:
        condition: service_healthy
    restart: "no"

  migrate:
    <<: *app
    environment:
      <<: *runtime-env
    command: [node, node_modules/drizzle-kit/bin.cjs, migrate]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app
    environment:
      <<: *runtime-env
      OWNER_EMAIL: ${OWNER_EMAIL:?Initialize .env.self-host first}
      OWNER_PASSWORD_HASH: ${OWNER_PASSWORD_HASH:?Initialize .env.self-host first}
      SESSION_SECRET: ${SESSION_SECRET:?Initialize .env.self-host first}
      S3_ENDPOINT: http://storage:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-planly-media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  worker:
    <<: *app
    environment:
      <<: *runtime-env
      S3_ENDPOINT: http://storage:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-planly-media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    command: [node, --experimental-strip-types, worker/index.ts]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    stop_grace_period: 60s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  media-data:
